services:
  mysql:
    image: mysql:8.0
    container_name: bp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bp}
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - bp_mysql_data:/var/lib/mysql
      - ./infra/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: bp-localstack
    restart: unless-stopped
    environment:
      SERVICES: dynamodb,sqs,events,s3
      DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      PERSISTENCE: 1
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - bp_localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-oidc:
    image: ghcr.io/soluto/oidc-server-mock:latest
    platform: linux/amd64
    container_name: bp-mock-oidc
    restart: unless-stopped
    ports:
      - "${MOCK_OIDC_PORT:-4011}:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      SERVER_OPTIONS_INLINE: |
        {
          "AccessTokenJwtType": "JWT",
          "Discovery": { "ShowKeySet": true },
          "Authentication": { "CookieSameSiteMode": "Lax", "CheckSessionCookieSameSiteMode": "Lax" }
        }
      LOGIN_OPTIONS_INLINE: |
        {
          "AllowRememberLogin": false
        }
      # API_SCOPES_INLINE/API_RESOURCES_INLINE: sin un recurso de API
      # configurado, el access token que emite mock-oidc no trae "aud" en
      # absoluto (solo "client_id") -- JwtValidator::assertAudienceMatches
      # rechaza esos tokens porque espera aud=bp-web (OIDC_AUDIENCE). Se
      # descubrio en la Fase 11 al completar por primera vez un login real
      # de punta a punta (fases anteriores solo probaron que /connect/authorize
      # aceptaba al cliente, nunca llegaron a canjear el codigo por un
      # token real). El fix es el mismo que se haria contra un tenant real
      # de Auth0/Okta: declarar un API resource/scope "bp-web" y pedirlo
      # explicitamente en el `scope` del login (ver oidcConfig.ts/authConfig.ts
      # de los frontends).
      API_SCOPES_INLINE: |
        [
          { "Name": "bp-web" }
        ]
      API_RESOURCES_INLINE: |
        [
          { "Name": "bp-web", "Scopes": ["bp-web"] }
        ]
      CLIENTS_CONFIGURATION_INLINE: |
        [
          {
            "ClientId": "bp-web",
            "ClientSecrets": [],
            "Description": "Cliente publico SPA/App movil de BP (Authorization Code + PKCE)",
            "AllowedGrantTypes": ["authorization_code"],
            "RequireClientSecret": false,
            "RequirePkce": true,
            "AllowedScopes": ["openid", "profile", "email", "offline_access", "bp-web"],
            "RedirectUris": ["http://localhost:5173/callback", "http://localhost:19006/callback"],
            "PostLogoutRedirectUris": ["http://localhost:5173", "http://localhost:19006"],
            "AllowOfflineAccess": true,
            "RequireConsent": false
          }
        ]
      USERS_CONFIGURATION_INLINE: |
        [
          {
            "SubjectId": "1",
            "Username": "cliente.demo",
            "Password": "Demo1234!",
            "Claims": [
              { "Type": "name", "Value": "Cliente Demo BP" },
              { "Type": "email", "Value": "cliente.demo@bp.test" }
            ]
          }
        ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Servicios backend (Fase 11: orquestacion end-to-end local) ---
  #
  # Todas las variables de red (OIDC_DISCOVERY_ISSUER, *_HOST, *_BASE_URL,
  # AWS_ENDPOINT_URL) usan nombres de servicio de docker-compose en vez de
  # localhost/127.0.0.1 -- dentro de la red de compose cada contenedor solo
  # se ve a si mismo como "localhost". OIDC_ISSUER (el valor esperado en el
  # claim `iss`) SI sigue siendo http://localhost:4011 a proposito: es el
  # emisor tal como lo ve el navegador al loguearse en la SPA/app movil, y
  # tiene que coincidir exactamente con lo que trae el token -- ver el
  # comentario en JwtValidator.php sobre por que discovery e issuer son dos
  # cosas distintas. Los contenedores no tienen archivo .env (no se copia
  # al build): dependen enteramente de las variables de entorno de aca.
  svc-datos-basicos:
    build:
      context: .
      dockerfile: services/svc-datos-basicos/Dockerfile
    container_name: bp-svc-datos-basicos
    restart: unless-stopped
    profiles: ["services"]
    ports:
      - "8001:8000"
    environment:
      APP_KEY: "base64:CNNW8MYzMblnNPkiEistyRuPtrUyMHTs6tXTg4Yz6MA="
      OIDC_DISCOVERY_ISSUER: http://mock-oidc:80
    depends_on:
      mock-oidc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  svc-movimientos:
    build:
      context: .
      dockerfile: services/svc-movimientos/Dockerfile
    container_name: bp-svc-movimientos
    restart: unless-stopped
    profiles: ["services"]
    ports:
      - "8002:8000"
    environment:
      APP_KEY: "base64:P8bQIljgbsoA6gipTbvfiPw4rX9iYV0Y0gl5hFcJHV4="
      OIDC_DISCOVERY_ISSUER: http://mock-oidc:80
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EVENT_BUS_NAME: bp-domain-events
      EVENT_SOURCE: bp.svc-movimientos
      MOVIMIENTOS_TABLE: movimientos
      MOVIMIENTOS_CACHE_STORE: redis
      MOVIMIENTOS_CACHE_TTL_SECONDS: "60"
    depends_on:
      mock-oidc:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  svc-transferencias:
    build:
      context: .
      dockerfile: services/svc-transferencias/Dockerfile
    container_name: bp-svc-transferencias
    restart: unless-stopped
    profiles: ["services"]
    ports:
      - "8003:8000"
    environment:
      APP_KEY: "base64://a8H44tLfaWLgeJHQCN5c8l6vDFPVQwlSC01V6hNSw="
      OIDC_DISCOVERY_ISSUER: http://mock-oidc:80
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: svc_transferencias
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EVENT_BUS_NAME: bp-domain-events
      EVENT_SOURCE: bp.svc-transferencias
      IDEMPOTENCY_CACHE_TTL_SECONDS: "86400"
      STEP_UP_THRESHOLD: "1000"
      INTERBANK_CIRCUIT_FAILURE_THRESHOLD: "3"
      INTERBANK_CIRCUIT_COOLDOWN_SECONDS: "30"
      INTERBANK_DRIVER: fake
    depends_on:
      mock-oidc:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  svc-auditoria:
    build:
      context: .
      dockerfile: services/svc-auditoria/Dockerfile
    container_name: bp-svc-auditoria
    restart: unless-stopped
    profiles: ["services"]
    environment:
      APP_KEY: "base64:t/8G1xsHNbH8q/FQ8GCL1vPYGpEfRF9zPaTfK0BHMQw="
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EVENT_BUS_NAME: bp-domain-events
      EVENT_SOURCE: bp.svc-auditoria
      AUDITORIA_TABLE: auditoria
      AUDITORIA_BUCKET: bp-auditoria-worm
      AUDITORIA_QUEUE_NAME: audit-events-queue
      AUDITORIA_DLQ_NAME: audit-events-dlq
      AUDITORIA_RULE_NAME: audit-all-domain-events
      AUDITORIA_QUEUE_URL: http://localstack:4566/000000000000/audit-events-queue
    depends_on:
      localstack:
        condition: service_healthy

  svc-notificaciones:
    build:
      context: .
      dockerfile: services/svc-notificaciones/Dockerfile
    container_name: bp-svc-notificaciones
    restart: unless-stopped
    profiles: ["services"]
    environment:
      APP_KEY: "base64:N5gZVUNQnbk+eEOWVFEJG+KbbCUYO9wzUjZqz5WFHgI="
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EVENT_BUS_NAME: bp-domain-events
      EVENT_SOURCE: bp.svc-notificaciones
      NOTIFICATION_DRIVER: log
      NOTIFICACIONES_TABLE: notification_deliveries
      NOTIFICACIONES_QUEUE_NAME: notification-events-queue
      NOTIFICACIONES_DLQ_NAME: notification-events-dlq
      NOTIFICACIONES_RULE_NAME: notify-all-domain-events
      NOTIFICACIONES_QUEUE_URL: http://localstack:4566/000000000000/notification-events-queue
    depends_on:
      localstack:
        condition: service_healthy

  bff-web:
    build:
      context: .
      dockerfile: services/bff-web/Dockerfile
    container_name: bp-bff-web
    restart: unless-stopped
    profiles: ["services"]
    ports:
      - "8010:8000"
    environment:
      APP_KEY: "base64:9+0gF8yJ+cfKpOtzBSyXG2ejRxtSPMgPizU9ECbRS2g="
      OIDC_DISCOVERY_ISSUER: http://mock-oidc:80
      DATOS_BASICOS_BASE_URL: http://svc-datos-basicos:8000
      MOVIMIENTOS_BASE_URL: http://svc-movimientos:8000
      TRANSFERENCIAS_BASE_URL: http://svc-transferencias:8000
    depends_on:
      mock-oidc:
        condition: service_healthy
      svc-datos-basicos:
        condition: service_healthy
      svc-movimientos:
        condition: service_healthy
      svc-transferencias:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  bff-mobile:
    build:
      context: .
      dockerfile: services/bff-mobile/Dockerfile
    container_name: bp-bff-mobile
    restart: unless-stopped
    profiles: ["services"]
    ports:
      - "8004:8000"
    environment:
      APP_KEY: "base64:f/uBz+4Chaxq5zvKVF5MWrGQeul7tNj6upV/S/83ySs="
      OIDC_DISCOVERY_ISSUER: http://mock-oidc:80
      DATOS_BASICOS_BASE_URL: http://svc-datos-basicos:8000
      MOVIMIENTOS_BASE_URL: http://svc-movimientos:8000
      TRANSFERENCIAS_BASE_URL: http://svc-transferencias:8000
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EVENT_BUS_NAME: bp-domain-events
      EVENT_SOURCE: bp.bff-mobile
      KYC_DRIVER: fake
      IDENTITY_DRIVER: fake
      LIVENESS_DRIVER: fake
    depends_on:
      mock-oidc:
        condition: service_healthy
      svc-datos-basicos:
        condition: service_healthy
      svc-movimientos:
        condition: service_healthy
      svc-transferencias:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  bp_mysql_data:
  bp_localstack_data:
